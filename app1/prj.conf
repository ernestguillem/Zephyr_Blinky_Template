# --------------------------------------------------
# Application-Specific Settings
# --------------------------------------------------

# Enable custom user-defined functionality
CONFIG_USR_FUN=y

# --------------------------------------------------
# Thread and RTOS Configuration
# --------------------------------------------------

# Enable thread naming (useful for debugging)
CONFIG_THREAD_NAME=y

# Enable stack sentinel to check for stack overflows
CONFIG_STACK_SENTINEL=y

# Generate a file specifying the maximum stack usage per function
CONFIG_STACK_USAGE=y

# --------------------------------------------------
# Tracing and Debugging (SystemView & RTT)
# --------------------------------------------------

# Enable system-wide tracing (required for SystemView)
CONFIG_TRACING=y

# Enable SEGGER SystemView support
CONFIG_SEGGER_SYSTEMVIEW=y

# Start tracing automatically on system boot
CONFIG_SEGGER_SYSTEMVIEW_BOOT_ENABLE=y

# Use SEGGER RTT as the backend for tracing and logging
CONFIG_USE_SEGGER_RTT=y

# Always initialize the RTT backend, even if a debugger is not attached
CONFIG_SEGGER_RTT_INIT_MODE_ALWAYS=y

# Include thread metadata (names, IDs) in the trace output
CONFIG_DEBUG_THREAD_INFO=y

# --------------------------------------------------
# Logging System
# --------------------------------------------------

# Enable the logging subsystem
CONFIG_LOG=y

# Use deferred logging (messages are buffered and processed by a thread)
CONFIG_LOG_MODE_DEFERRED=y

# Allow changing log verbosity levels at runtime
CONFIG_LOG_RUNTIME_FILTERING=y

# Redirect printk() output to the logging system
CONFIG_LOG_PRINTK=y

# Process log buffer as soon as any message is added
CONFIG_LOG_PROCESS_TRIGGER_THRESHOLD=0

# Set the size of the log message buffer (in bytes)
CONFIG_LOG_BUFFER_SIZE=2048

# Set INFO level log color to green
CONFIG_LOG_INFO_COLOR_GREEN=y

# Set DEBUG level log color to blue
CONFIG_LOG_DBG_COLOR_BLUE=y

# Disable code coverage analysis
CONFIG_COVERAGE=n

# --------------------------------------------------
# Shell System
# --------------------------------------------------

# Enable the shell interface
CONFIG_SHELL=y

# Enable the shell as a backend for viewing logs
CONFIG_SHELL_LOG_BACKEND=y

# Set the shell prompt for the UART backend
CONFIG_SHELL_PROMPT_UART=">"

# Set the size of the shell command history buffer
CONFIG_SHELL_HISTORY_BUFFER=128

# Enable shell commands for controlling the logging system
CONFIG_LOG_CMDS=y

# Enable shell commands for kernel information (threads, etc.)
CONFIG_KERNEL_SHELL=y

# Enable shell commands for device information
CONFIG_DEVICE_SHELL=y

# Enable shell commands for PWM control
CONFIG_PWM_SHELL=y

# Disable shell commands for direct memory access (devmem)
CONFIG_DEVMEM_SHELL=n

# Disable return value reporting for shell commands
CONFIG_SHELL_CMDS_RETURN_VALUE=n

# Disable advanced meta key handling (e.g., Alt+key combinations)
CONFIG_SHELL_METAKEYS=n

# Disable shell terminal resize support
CONFIG_SHELL_CMDS_RESIZE=n

# --------------------------------------------------
# Device Drivers
# --------------------------------------------------

# Enable the PWM (Pulse-Width Modulation) subsystem
CONFIG_PWM=y

# Enable the STM32-specific PWM driver
CONFIG_PWM_STM32=y
