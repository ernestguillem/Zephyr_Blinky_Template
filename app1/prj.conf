# Test function to activate certain code
CONFIG_USR_FUN=y

CONFIG_TRACING=y
CONFIG_SEGGER_SYSTEMVIEW=y

# enable to use thread names
CONFIG_THREAD_NAME=y

# SystemView config
CONFIG_SEGGER_SYSTEMVIEW_BOOT_ENABLE=y
CONFIG_SEGGER_RTT_INIT_MODE_ALWAYS=y
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_USE_SEGGER_RTT=y


# Logging system
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_LOG_PRINTK=n
CONFIG_LOG_PROCESS_TRIGGER_THRESHOLD=0
CONFIG_COVERAGE=n
CONFIG_LOG_INFO_COLOR_GREEN=y
CONFIG_LOG_DBG_COLOR_BLUE=y

# Shell system
CONFIG_SHELL=y
CONFIG_LOG_CMDS=y
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=n
CONFIG_DEVMEM_SHELL=n
CONFIG_SHELL_CMDS_RETURN_VALUE=n
CONFIG_SHELL_METAKEYS=n
CONFIG_SHELL_CMDS_RESIZE=n
CONFIG_SHELL_PROMPT_UART=">"
CONFIG_SHELL_HISTORY_BUFFER=128
